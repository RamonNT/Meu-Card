<html lang="pt-BR">
<!-- Define o idioma principal da página. -->
<head>
    <!-- Permite exibir corretamente acentos e caracteres especiais. -->
    <meta charset="UTF-8">

    <!-- Ajuda a página a se adaptar a telas de celulares e computadores. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Texto exibido na aba do navegador. -->
    <title>Portfólio</title>

    <!-- Carrega as regras de estilo guardadas no arquivo CSS externo. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- O conteúdo visível do site será colocado aqui. -->

    <header>
        <nav>
            <!-- Cada link leva a uma seção identificada por um ID. -->
            <a href="https://www.google.com/?hl=pt_BR">Iníciooooo</a>
            <a href="#sobre">Sobre mim</a>
            <a href="#habilidades">Habilidades</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>


    <main>
        <!-- Área inicial do portfólio; o ID permite navegar até ela. -->
        <section id="inicio" class="apresentacao">
        <div class="texto-apresentacao">
            <!-- Texto curto que funciona como introdução. -->
            <p class="destaque">Olá! Seja bem-vindo(a).</p>

            <!-- Título principal: personalize com seu nome. -->
            <h1>Eu sou Ramon Guedes</h1>

            <!-- Uma frase para apresentar seu objetivo ou interesse. -->
            <p>Estou aprendendo a criar sites com HTML e CSS.</p>

            <!-- Link com aparência de botão; leva à seção Sobre mim. -->
            <a class="botao" href="#sobre">Conheça meu perfil</a>
        </div>

        <!-- Imagem do perfil. O caminho aponta para a pasta imagens. -->
        <img class="foto-perfil" src="imagem/Eu.png" alt="Foto de perfil de Carlos Silva"> 

    </section>

        <img class="fundo" src="imagem/fundo2.jpg">

    </main>

    <footer>
        <p>2026 - Ramon Guedes.</p>
    </footer>
</body>


</html>
